name: Update YouTube feed
# 🔴 AUTOMATISATION RETIRÉE LE 07/10/2026 — ne se déclenche plus tout seul.
#
# Ce workflow échouait à chaque exécution depuis le 02/10/2026 (dernier succès : 30/09),
# à l'étape « Fetch YouTube videos » : le secret YT_TOKEN_ANALYTICS n'authentifie plus.
# Reproduit en local, sans secret : « Aucune méthode d'authentification disponible ».
#
# Le token YouTube vit sur le VPS et y fonctionne. C'est donc le VPS qui fait le travail
# désormais : ~/.hermes/scripts/maj_feed_youtube.py (Lun/Mer/Ven 6h), qui met à jour
# data/, commit et pousse.
#
# Conservé en LANCEMENT MANUEL seulement, pour arrêter les emails d'échec.
# Pour le réactiver : reposer un secret YT_TOKEN_ANALYTICS valide, puis remettre le bloc
# `schedule:` ci-dessous.
#   schedule:
#     - cron: '0 6 * * 1,3,5'  # Lun/Mer/Ven à 6h UTC
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch YouTube videos
        env:
          # Méthode recommandée (unifiée)
          YT_TOKEN_ANALYTICS: ${{ secrets.YT_TOKEN_ANALYTICS }}
          # Méthode legacy (fallback)
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python fetch_youtube.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: YouTube feed update"
          git push